theme:
  name: material
  language: es
  palette:
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate

# Fallback si material no está instalado:
# theme:
#   name: mkdocs

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
